apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
spec:
  project: default
  # In this Argocd Application, we are using two sources: $values are referenced from the values.yaml file in the 
  # devops-eks-cluster repo and the jenkins helm chart is referenced from the jenkins helm chart repo.
  sources:
    - repoURL: https://charts.jenkins.io
      chart: jenkins
      targetRevision: 5.7.0
      helm:
        valueFiles:
          - $values/jenkins/values.yaml
    - repoURL: https://github.com/<your-username>/devops-eks-cluster.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true